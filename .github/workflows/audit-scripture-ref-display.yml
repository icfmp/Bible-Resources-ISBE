name: Audit ISBE Scripture-reference display consistency

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/audit_scripture_ref_display.py'
      - 'tests/test_audit_scripture_ref_display.py'
      - '.github/workflows/audit-scripture-ref-display.yml'

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run regression tests
        run: python3 -m unittest discover -s tests -p 'test_audit_scripture_ref_display.py' -v
      - name: Generate candidate-only report against pinned canonical TEI
        run: |
          python3 scripts/audit_scripture_ref_display.py workspace/witnesses/crosswire-2.2/ISBE.xml \
            --report workspace/tmp/scripture-ref-display-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: isbe-scripture-ref-display-review-queue
          path: workspace/tmp/scripture-ref-display-audit.json
          if-no-files-found: error
