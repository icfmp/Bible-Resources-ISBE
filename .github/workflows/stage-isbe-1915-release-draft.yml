name: Prepare ISBE 1915 source-only GitHub draft (never publish)

on:
  push:
    branches:
      - release-draft/isbe-1915-rc1
    paths:
      - '.github/workflows/stage-isbe-1915-release-draft.yml'

permissions:
  contents: write

jobs:
  exact-source-only-unpublished-draft:
    if: github.ref == 'refs/heads/release-draft/isbe-1915-rc1'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: \${{ secrets.GITHUB_TOKEN }}
      GH_REPO: \${{ github.repository }}
      TAG: isbe-1915-v0.1.0-rc.1
      SOURCE_COMMIT: 0853bc904acc24de50fb49ab75a32a5b2bb3c339
    steps:
      - name: Checkout draft preparation and release notes
        uses: actions/checkout@v4
        with:
          path: preparation
      - name: Checkout exact previously validated historical source commit
        uses: actions/checkout@v4
        with:
          ref: 0853bc904acc24de50fb49ab75a32a5b2bb3c339
          path: pinned-source
          persist-credentials: false
      - name: Verify exact original source, corrected master and explicit rights gate
        working-directory: pinned-source
        run: |
          set -euo pipefail
          python3 scripts/persist_1915_cleaned_master.py --verify-only
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('sources/cleaned/encyclopedias/en/isbe-1915/CLEANUP_MANIFEST.json').read_text())
          assert r['cleaned_sha256']=='5df8a6d1311e3f5a83a6d961c6e09c27e042b0c68b4a9da54cb98821cb878d2c'
          assert r['article_count']==9380
          assert r['publication_permitted'] is False
          assert r['rights_redistribution_cleared'] is False
          assert r['modernized'] is False
          PY
          python3 -m unittest discover -s tests -p test_persist_1915_cleaned_master.py -v
      - name: Independently reproduce the full historical edited XML before staging assets
        working-directory: pinned-source
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq jing
          python3 scripts/persist_1915_cleaned_master.py --assemble
          git diff --exit-code -- \
            sources/original/encyclopedias/en/isbe-crosswire-2.2/ \
            sources/cleaned/encyclopedias/en/isbe-1915/
      - name: Construct deterministic source-only ZIP and SHA-256 checksum file
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import json
          from zipfile import ZipFile, ZipInfo, ZIP_DEFLATED
          manifest=json.loads(Path('pinned-source/sources/cleaned/encyclopedias/en/isbe-1915/CLEANUP_MANIFEST.json').read_text())
          staging=Path('staging')
          staging.mkdir(exist_ok=True)
          files=[
             ('pinned-source/sources/cleaned/encyclopedias/en/isbe-1915/ISBE.xml','ISBE.xml'),
             ('pinned-source/sources/cleaned/encyclopedias/en/isbe-1915/CLEANUP_MANIFEST.json','CLEANUP_MANIFEST.json'),
             ('pinned-source/sources/original/encyclopedias/en/isbe-crosswire-2.2/PROVENANCE.json','CROSSWIRE_PROVENANCE.json'),
             ('preparation/release/drafts/isbe-1915-v0.1.0-rc.1/RELEASE_NOTES.md','RELEASE_NOTES.md'),
             ('preparation/release/drafts/isbe-1915-v0.1.0-rc.1/PUBLICATION_GATES.md','PUBLICATION_GATES.md'),
          ]
          assert sha256(Path(files[0][0]).read_bytes()).hexdigest()==manifest['cleaned_sha256']
          name='ISBE-1915-corrected-historical-source-v0.1.0-rc.1.zip'
          target=staging/name
          with ZipFile(target,'w',compression=ZIP_DEFLATED,compresslevel=9) as archive:
              for path,name_inside in files:
                  info=ZipInfo(name_inside,date_time=(1980,1,1,0,0,0))
                  info.compress_type=ZIP_DEFLATED
                  info.external_attr=(0o100644 & 0xFFFF)<<16
                  archive.writestr(info,Path(path).read_bytes(),compress_type=ZIP_DEFLATED,compresslevel=9)
          with ZipFile(target) as check:
              assert check.testzip() is None
              assert sha256(check.read('ISBE.xml')).hexdigest()==manifest['cleaned_sha256']
          checksum_path=staging/'ISBE-1915-v0.1.0-rc.1-SHA256SUMS.txt'
          checksum_path.write_text(
             f"{sha256(target.read_bytes()).hexdigest()}  {target.name}\n"
             f"{manifest['cleaned_sha256']}  ISBE.xml (inside ZIP)\n"
             f"{manifest['original_module_sha256']}  original CrossWire ISBE 2.2 ZIP (provenance only; not attached)\n"
          )
          print("Exact source text SHA:",manifest['cleaned_sha256'])
          print("Draft ZIP size:",target.stat().st_size)
          print(checksum_path.read_text())
          PY
      - name: Create release DRAFT ONLY and verify never published
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
              echo "Refusing to replace an existing release of the same name" >&2
              exit 1
          fi
          gh release create "$TAG" \
            staging/ISBE-1915-corrected-historical-source-v0.1.0-rc.1.zip \
            staging/ISBE-1915-v0.1.0-rc.1-SHA256SUMS.txt \
            --repo "$GH_REPO" \
            --target "$SOURCE_COMMIT" \
            --title "ISBE 1915 historical corrected TEI v0.1.0 RC1 — DRAFT (rights review)" \
            --notes-file preparation/release/drafts/isbe-1915-v0.1.0-rc.1/RELEASE_NOTES.md \
            --draft \
            --prerelease \
            --latest=false
          gh release view "$TAG" --repo "$GH_REPO" --json isDraft,isPrerelease,tagName,assets,url \
            --jq '{draft: .isDraft, prerelease: .isPrerelease, tag: .tagName, url: .url, assets: [.assets[].name]}'
          test "$(gh release view "$TAG" --repo "$GH_REPO" --json isDraft --jq '.isDraft')" = true
          test "$(gh release view "$TAG" --repo "$GH_REPO" --json isPrerelease --jq '.isPrerelease')" = true
          echo "SUCCESS: source-only GitHub RELEASE DRAFT; not published."
