name: Retain original CrossWire and corrected ISBE 1915 working sources

on:
  push:
    branches:
      - feat/retained-original-and-cleaned-isbe-master
    paths:
      - scripts/persist_1915_cleaned_master.py
      - tests/test_persist_1915_cleaned_master.py
      - .github/workflows/retain-isbe-working-sources.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-store-exact-reviewed-masters:
    if: github.ref == 'refs/heads/feat/retained-original-and-cleaned-isbe-master'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Verify original/edited source separation and fail-closed conditions
        run: python3 -m unittest discover -s tests -p 'test_persist_1915_cleaned_master.py' -v
      - name: Check all earlier approved source-correction negative controls
        run: |
          python3 -m unittest discover -s tests -p 'test_apply_1915_scripture_targets.py' -v
          python3 -m unittest discover -s tests -p 'test_apply_1915_reference_text_deltas.py' -v
          python3 -m unittest discover -s tests -p 'test_apply_display_verified_scripture_targets.py' -v
          python3 -m unittest discover -s tests -p 'test_apply_1915_low_overlap_prose_deltas.py' -v
          python3 -m unittest discover -s tests -p 'test_apply_1915_additional_prose_deltas.py' -v
          python3 -m unittest discover -s tests -p 'test_apply_1915_printed_apocrypha_refs.py' -v
      - name: Install official pinned TEI P5 schema validator
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jing
      - name: Rebuild all source-locked corrections, verify historical source and original SHA and official TEI P5
        run: |
          set -euo pipefail
          python3 scripts/persist_1915_cleaned_master.py --assemble
          python3 scripts/persist_1915_cleaned_master.py --verify-only
      - name: Save EXACT original and cleaned source bytes plus manifests on the working branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources/original/encyclopedias/en/isbe-crosswire-2.2/
          git add sources/cleaned/encyclopedias/en/isbe-1915/ISBE.xml
          git add sources/cleaned/encyclopedias/en/isbe-1915/CLEANUP_MANIFEST.json
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo "Exact original and cleaned sources already committed."
          else
            git commit -m "Preserve byte-locked CrossWire original and validated corrected ISBE working master"
            git push origin HEAD:feat/retained-original-and-cleaned-isbe-master
          fi
