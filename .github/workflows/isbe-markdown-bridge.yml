name: Validate ISBE Markdown paragraph translation bridge

on:
  push:
    paths:
      - 'scripts/translation_markdown_layout.py'
      - 'scripts/markdown_translation_bridge.py'
      - 'tests/test_markdown_translation_bridge.py'
      - 'tests/test_markdown_bridge_guards.py'
      - 'tests/test_markdown_bridge_existing_batch.py'
      - 'docs/isbe-markdown-translation-bridge.md'
      - '.github/workflows/isbe-markdown-bridge.yml'
  pull_request:
    paths:
      - 'scripts/translation_markdown_layout.py'
      - 'scripts/markdown_translation_bridge.py'
      - 'tests/test_markdown_translation_bridge.py'
      - 'tests/test_markdown_bridge_guards.py'
      - 'tests/test_markdown_bridge_existing_batch.py'
      - 'docs/isbe-markdown-translation-bridge.md'
      - '.github/workflows/isbe-markdown-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate anchored paragraph compilation fixture
        run: python3 -m unittest tests.test_markdown_translation_bridge tests.test_markdown_bridge_guards tests.test_markdown_bridge_existing_batch -v
      - name: Inspect real original TEI paragraphs for source-map compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from scripts.translation_markdown_layout import build_blocks
          from scripts.validate_translation_identity import read_body
          path=Path('sources/cleaned/encyclopedias/en/isbe-1915/ISBE.xml')
          _,body=read_body(path)
          errors=[]
          count=0
          for article in body:
              count+=1
              try:
                  blocks=build_blocks(article)
                  if not blocks:
                      errors.append((article.get('n'),'no blocks'))
              except ValueError as exc:
                  errors.append((article.get('n'),str(exc)))
          print(f'Examined {count} original source entries; incompatible: {len(errors)}')
          for row in errors[:40]:
              print('INCOMPATIBLE SOURCE',row)
          assert count==9380, 'Historical English source index changed'
          assert not errors, 'Generic Markdown bridge cannot safely map all original entries'
          PY
