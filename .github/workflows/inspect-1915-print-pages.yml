name: Inspect original 1915 ISBE printed pages

on:
  pull_request:
    paths:
      - 'scripts/render_1915_print_evidence.py'
      - 'tests/test_render_1915_print_evidence.py'
      - '.github/workflows/inspect-1915-print-pages.yml'
  workflow_dispatch:

jobs:
  page-images:
    # Archive PDFs are expensive to fetch; keep repeat inspection explicit.
    # Temporary one-time visual evidence run on this PR; return to manual before merge.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {volume: "1", pages: "192,458"}
          - {volume: "2", pages: "699,731"}
          - {volume: "3", pages: "624,626"}
          - {volume: "4", pages: "618,663,667"}
    steps:
      - uses: actions/checkout@v4
      - name: Install source-page rendering tool
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Fetch exact 1915 original printed volume
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p workspace/tmp/print-evidence
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors \
            --connect-timeout 20 --max-time 360 \
            "https://commons.wikimedia.org/wiki/Special:Redirect/file/The_International_Standard_Bible_Encyclopedia_Volume_${{ matrix.volume }}.pdf" \
            --output "workspace/tmp/print-evidence/vol-${{ matrix.volume }}.pdf"
      - name: Render SHA-locked page images to temporary evidence log
        run: |
          python scripts/render_1915_print_evidence.py \
            --pdf "workspace/tmp/print-evidence/vol-${{ matrix.volume }}.pdf" \
            --volume "${{ matrix.volume }}" \
            --pages "${{ matrix.pages }}"
