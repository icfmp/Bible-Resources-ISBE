name: Build and native-verify corrected historical ISBE SWORD dictionary

on:
  push:
    branches: [main]
    paths:
      - scripts/export_tei_dictionary_for_sword.py
      - scripts/validate_sword_dictionary_roundtrip.py
      - scripts/audit_sword_dictionary_headings.py
      - tests/test_sword_dictionary_headings.py
      - scripts/audit_sword_reference_targets.py
      - tests/test_sword_reference_targets.py
      - tests/test_sword_dictionary_adapter.py
      - modules/isbe-1915/**
      - sources/cleaned/encyclopedias/en/isbe-1915/**
      - .github/workflows/build-isbe-sword-candidate.yml
  pull_request:
    paths:
      - scripts/export_tei_dictionary_for_sword.py
      - scripts/validate_sword_dictionary_roundtrip.py
      - scripts/audit_sword_dictionary_headings.py
      - tests/test_sword_dictionary_headings.py
      - scripts/audit_sword_reference_targets.py
      - tests/test_sword_reference_targets.py
      - tests/test_sword_dictionary_adapter.py
      - modules/isbe-1915/**
      - sources/cleaned/encyclopedias/en/isbe-1915/**
      - .github/workflows/build-isbe-sword-candidate.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-lexicon:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install upstream SWORD 1.9 dictionary compiler and reader tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsword-utils diatheke
          command -v tei2mod
          command -v mod2imp
          command -v diatheke
      - name: Prepare exact 9380-entry source without changing historic TEI
        run: |
          set -euo pipefail
          python3 scripts/persist_1915_cleaned_master.py --verify-only
          python3 scripts/export_tei_dictionary_for_sword.py \
            --source sources/cleaned/encyclopedias/en/isbe-1915/ISBE.xml \
            --expected-sha256 5df8a6d1311e3f5a83a6d961c6e09c27e042b0c68b4a9da54cb98821cb878d2c \
            --expected-count 9380 \
            --output workspace/tmp/isbe-sword-import.xml \
            --report workspace/tmp/isbe-sword-import-report.json
          python3 -m unittest discover -s tests -p 'test_sword_dictionary_adapter.py' -v
      - name: Audit preserved source headings versus dictionary labels
        run: |
          set -euo pipefail
          python3 scripts/audit_sword_dictionary_headings.py \
            --source sources/cleaned/encyclopedias/en/isbe-1915/ISBE.xml \
            --adapted workspace/tmp/isbe-sword-import.xml \
            --report workspace/tmp/sword-heading-profile.json
          python3 -m unittest discover -s tests -p 'test_sword_dictionary_headings.py' -v
      - name: Verify and inventory every historic encyclopedia and Bible link
        run: |
          set -euo pipefail
          python3 scripts/audit_sword_reference_targets.py \
            --source sources/cleaned/encyclopedias/en/isbe-1915/ISBE.xml \
            --adapted workspace/tmp/isbe-sword-import.xml \
            --report workspace/tmp/sword-reference-target-register.json
          python3 -m unittest discover -s tests -p 'test_sword_reference_targets.py' -v
      - name: Compile an actual independent zLD binary from the corrected edition
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p workspace/tmp/native-root/modules/lexdict/zld/brisbe1915
          mkdir -p workspace/tmp/native-root/mods.d
          if ! tei2mod workspace/tmp/native-root/modules/lexdict/zld/brisbe1915 \
            workspace/tmp/isbe-sword-import.xml -z z -N \
            > workspace/tmp/tei2mod.log 2>&1; then
            tail -60 workspace/tmp/tei2mod.log
            exit 1
          fi
          { tei2mod --version || true; }
          find workspace/tmp/native-root/modules/lexdict/zld/brisbe1915/ -type f -printf '%P %s bytes\n'
          cat > workspace/tmp/native-root/mods.d/brisbe1915.conf <<'CONF'
          [BRISBE1915]
          DataPath=./modules/lexdict/zld/brisbe1915/dict
          ModDrv=zLD
          CompressType=ZIP
          SourceType=TEI
          Encoding=UTF-8
          Lang=en
          Version=0.1.0
          Description=International Standard Bible Encyclopedia (1915, historically corrected working edition)
          About=Edited historical English ISBE; original CrossWire 2.2 with source-attested repairs. Original print collation incomplete. DO NOT REDISTRIBUTE PENDING RIGHTS REVIEW.
          DistributionLicense=Copyrighted
          CONF
      - name: Read all actual native module entries back through libSWORD
        shell: bash
        run: |
          set -euo pipefail
          export SWORD_PATH="$PWD/workspace/tmp/native-root"
          diatheke -b system -k modulelist > workspace/tmp/native-module-list.txt
          cat workspace/tmp/native-module-list.txt
          grep -q BRISBE1915 workspace/tmp/native-module-list.txt
          mod2imp BRISBE1915 > workspace/tmp/native-module.imp
          python3 scripts/validate_sword_dictionary_roundtrip.py \
            --input-tei workspace/tmp/isbe-sword-import.xml \
            --native-imp workspace/tmp/native-module.imp \
            --report workspace/tmp/sword-native-roundtrip.json
      - name: Render representative articles through independent diatheke frontend
        shell: bash
        run: |
          set -euo pipefail
          export SWORD_PATH="$PWD/workspace/tmp/native-root"
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          samples=["AARON","ABIDE","GAINSAY","ZEBIDAH"]
          results={}
          for key in samples:
              variants={}
              for fmt in ("HTML","HTMLHREF","plain"):
                  proc=subprocess.run(["diatheke","-b","BRISBE1915",
                                       "-f",fmt,"-k",key],
                                      check=True,capture_output=True,text=True,
                                      env=os.environ)
                  rendered=proc.stdout
                  if len(rendered)<80 or key.casefold() not in rendered.casefold():
                      raise RuntimeError(f"Native reader returned empty or unexpected {fmt} for {key}")
                  anchors=rendered.count("<a ")
                  hrefs=rendered.count("href=")
                  # These selected entries contain real annotated links.
                  # A passing text-only readback must never conceal a
                  # renderer regression silently removing *all* anchors.
                  if fmt=="HTMLHREF" and (anchors<1 or hrefs<1):
                      raise RuntimeError(f"Native reader lost HTMLHREF links for {key}")
                  variants[fmt]={"rendered_characters":len(rendered),
                                 "html_anchor_count":anchors,
                                 "html_reference_count":hrefs}
              results[key]=variants
          report={"frontend":"diatheke three render formats via libSWORD",
                  "formats":["HTML","HTMLHREF","plain"],
                  "smoke_articles":results,
                  "independent_gui_reader_verified":False,
                  "rights_cleared":False,
                  "published":False}
          Path("workspace/tmp/diatheke-render-smoke.json").write_text(
               json.dumps(report,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(report,indent=2))
          PY
          python3 -m json.tool workspace/tmp/diatheke-render-smoke.json > /dev/null
      - name: Record exact independently built native binary hashes
        if: success()
        run: |
          set -euo pipefail
          cd workspace/tmp/native-root
          find . -type f -print0 | sort -z | xargs -0 sha256sum > ../native-module-sha256sums.txt
          tar -czf ../BRISBE1915-native-candidate-NOT-FOR-PUBLICATION.tar.gz .
          cd ..
          sha256sum BRISBE1915-native-candidate-NOT-FOR-PUBLICATION.tar.gz
      - name: Retain diagnostics of source conversion and native readback
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brisbe1915-native-validation-diagnostics
          path: |
            workspace/tmp/isbe-sword-import-report.json
            workspace/tmp/sword-native-roundtrip.json
            workspace/tmp/native-module-list.txt
            workspace/tmp/tei2mod.log
            workspace/tmp/native-module-sha256sums.txt
            workspace/tmp/diatheke-render-smoke.json
            workspace/tmp/sword-heading-profile.json
            workspace/tmp/sword-reference-target-register.json
          if-no-files-found: warn
          retention-days: 14
      # No compiled encyclopedia binary is uploaded as an Actions artifact.
      # A public GitHub repository's build artifacts are not a rights-cleared
      # distribution channel. Store source metadata only until issue #1 closes.
