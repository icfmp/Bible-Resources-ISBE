name: Build and verify lossless ISBE TEI candidate
on:
  pull_request:
    paths:
      - scripts/normalize_tei_p5.py
      - scripts/rebuild_tei.py
      - workspace/reviews/accepted-title-aliases.json
      - workspace/exports/isbe-2.2.imp
      - scripts/check_tei_p5_svrl.py
      - scripts/validate_official_tei_p5.py
      - tests/test_normalize_tei_p5.py
      - tests/test_check_tei_p5_svrl.py
      - workspace/changes/tei-p5-candidate-v1.json
      - .github/workflows/tei-p5-candidate.yml
      - cleaned/en/ISBE.xml
      - cleaned/en/article-index.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-fidelity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test all existing and new source-fidelity fixtures
        run: python3 -m unittest discover -s tests -v
      - name: Rebuild original faithful witness from preserved IMP without overwriting master
        shell: bash
        run: |
          set -euo pipefail
          test -s workspace/exports/isbe-2.2.imp
          mkdir -p workspace/tmp/isbe-legacy
          python3 scripts/rebuild_tei.py \
            --input workspace/exports/isbe-2.2.imp \
            --accepted-aliases workspace/reviews/accepted-title-aliases.json \
            --output workspace/tmp/isbe-legacy/ISBE.xml \
            --index workspace/tmp/isbe-legacy/article-index.json \
            --report workspace/tmp/isbe-legacy/tei-reconstruction.json
          python3 - <<'PY'
          import json, hashlib
          from pathlib import Path
          lock = json.loads(Path("workspace/changes/tei-p5-candidate-v1.json").read_text(encoding="utf-8"))
          source = Path("workspace/tmp/isbe-legacy/ISBE.xml")
          actual = hashlib.sha256(source.read_bytes()).hexdigest()
          if actual != lock["source_sha256"]:
              raise SystemExit("Fresh CrossWire IMP rebuild diverged from pinned faithful source: " + actual)
          print("Verified preserved IMP rebuild SHA-256:", actual)
          PY
      - name: Produce separate serialized candidate and all-article parity report
        run: |
          mkdir -p workspace/candidates/en
          python3 scripts/normalize_tei_p5.py \
            --input workspace/tmp/isbe-legacy/ISBE.xml \
            --index workspace/tmp/isbe-legacy/article-index.json \
            --manifest workspace/changes/tei-p5-candidate-v1.json \
            --output workspace/candidates/en/ISBE.xml \
            --report workspace/candidates/en/tei-p5-candidate-report.json
      - name: Validate full candidate with pinned official TEI P5 schemas
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq jing
          python3 scripts/validate_official_tei_p5.py \
            --manifest workspace/changes/tei-p5-candidate-v1.json \
            --candidate workspace/candidates/en/ISBE.xml \
            --source-report workspace/candidates/en/tei-p5-candidate-report.json \
            --output workspace/candidates/en/tei-p5-official-validation.json
          dpkg-query -W -f='${binary:Package} ${Version}\n' jing libjing-java libsaxonhe-java
      - name: Publish validated candidate and separate verification reports
        uses: actions/upload-artifact@v4
        with:
          name: isbe-tei-p5-validated-candidate
          path: |
            workspace/candidates/en/ISBE.xml
            workspace/candidates/en/tei-p5-candidate-report.json
            workspace/candidates/en/tei-p5-official-validation.json
          if-no-files-found: error
          retention-days: 30
