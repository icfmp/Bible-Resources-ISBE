name: Build and verify lossless ISBE TEI candidate
on:
  pull_request:
    paths:
      - scripts/normalize_tei_p5.py
      - tests/test_normalize_tei_p5.py
      - workspace/changes/tei-p5-candidate-v1.json
      - .github/workflows/tei-p5-candidate.yml
      - cleaned/en/ISBE.xml
      - cleaned/en/article-index.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-fidelity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test all existing and new source-fidelity fixtures
        run: python3 -m unittest discover -s tests -v
      - name: Produce separate serialized candidate and all-article parity report
        run: |
          mkdir -p workspace/candidates/en
          python3 scripts/normalize_tei_p5.py \
            --input cleaned/en/ISBE.xml \
            --index cleaned/en/article-index.json \
            --manifest workspace/changes/tei-p5-candidate-v1.json \
            --output workspace/candidates/en/ISBE.xml \
            --report workspace/candidates/en/tei-p5-candidate-report.json
      - name: Verify pinned official TEI P5 4.12.0 RELAX NG schema
        shell: bash
        run: |
          set -euo pipefail
          url="https://www.tei-c.org/Vault/P5/4.12.0/xml/tei/custom/schema/relaxng/tei_all.rng"
          curl --fail --location --silent --show-error --retry 2 "$url" -o /tmp/tei_all-4.12.0.rng
          echo "b0f115095ead2ccc6933aa3365c6f4a82cba3b2ec7eee7f76bb616d7a63b7e48  /tmp/tei_all-4.12.0.rng" | sha256sum --check --strict
          sudo apt-get update -qq
          sudo apt-get install -y -qq jing
          jing /tmp/tei_all-4.12.0.rng workspace/candidates/en/ISBE.xml
      - name: Confirm the official schema rejects an invalid paragraph
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/invalid-tei-p5.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <TEI xmlns="http://www.tei-c.org/ns/1.0">
            <teiHeader><fileDesc><titleStmt><title>Invalid control</title></titleStmt>
            <publicationStmt><p>Test</p></publicationStmt>
            <sourceDesc><p>Test</p></sourceDesc></fileDesc></teiHeader>
            <text><body><p type="not-valid-on-p">Bad</p></body></text>
          </TEI>
          XML
          if jing /tmp/tei_all-4.12.0.rng /tmp/invalid-tei-p5.xml; then
            echo "Official RNG accepted the intentionally invalid fixture" >&2
            exit 1
          fi
          echo "Verified: malformed TEI structural control rejected"
      - name: Probe pinned official TEI Schematron with ISO Saxon implementation
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          sch="https://www.tei-c.org/Vault/P5/4.12.0/xml/tei/Exemplars/tei_all.isosch"
          curl --fail --location --silent --show-error --retry 2 "$sch" -o /tmp/tei_all-4.12.0.isosch
          echo "500f231ac32d12827bdbdd4168e88743848656bc46cc83286d39bd1f396113d5  /tmp/tei_all-4.12.0.isosch" | sha256sum --check --strict
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('/tmp/tei_all-4.12.0.isosch').getroot()
          print('Official Schematron root:', root.tag, root.attrib)
          print('Patterns:', len(root.findall('{http://purl.oclc.org/dsdl/schematron}pattern')))
          PY
          mkdir -p /tmp/schiso
          source="https://raw.githubusercontent.com/Schematron/schematron/77dcd36c53d12ed786c144ece3b2af7694abdc56/trunk/schematron/code"
          for name in iso_dsdl_include.xsl iso_abstract_expand.xsl iso_svrl_for_xslt2.xsl iso_schematron_skeleton_for_saxon.xsl; do
            curl --fail --location --silent --show-error --retry 2 "$source/$name" -o "/tmp/schiso/$name"
          done
          java -cp /usr/share/java/Saxon-HE.jar net.sf.saxon.Transform -s:/tmp/tei_all-4.12.0.isosch -xsl:/tmp/schiso/iso_dsdl_include.xsl -o:/tmp/schiso/included.sch
          java -cp /usr/share/java/Saxon-HE.jar net.sf.saxon.Transform -s:/tmp/schiso/included.sch -xsl:/tmp/schiso/iso_abstract_expand.xsl -o:/tmp/schiso/expanded.sch
          java -cp /usr/share/java/Saxon-HE.jar net.sf.saxon.Transform -s:/tmp/schiso/expanded.sch -xsl:/tmp/schiso/iso_svrl_for_xslt2.xsl -o:/tmp/schiso/validator.xsl
          java -cp /usr/share/java/Saxon-HE.jar net.sf.saxon.Transform -s:workspace/candidates/en/ISBE.xml -xsl:/tmp/schiso/validator.xsl -o:/tmp/schiso/result.svrl
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          namespace = '{http://purl.oclc.org/dsdl/svrl}'
          root = ET.parse('/tmp/schiso/result.svrl').getroot()
          failures = root.findall('.//' + namespace + 'failed-assert')
          reports = root.findall('.//' + namespace + 'successful-report')
          print('Schematron SVRL:', len(failures), 'failed assertions and',
                len(reports), 'successful reports')
          for el in (failures + reports)[:12]:
              print(el.get('location'), ''.join(el.itertext())[:500])
          if failures or reports:
              raise SystemExit('Official Schematron diagnostics require review')
          PY
      - name: Publish candidate for independent official schema review
        uses: actions/upload-artifact@v4
        with:
          name: isbe-tei-p5-unvalidated-candidate
          path: |
            workspace/candidates/en/ISBE.xml
            workspace/candidates/en/tei-p5-candidate-report.json
          if-no-files-found: error
          retention-days: 30
