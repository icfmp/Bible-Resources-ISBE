name: Build and verify lossless ISBE TEI candidate
on:
  pull_request:
    paths:
      - scripts/normalize_tei_p5.py
      - tests/test_normalize_tei_p5.py
      - workspace/changes/tei-p5-candidate-v1.json
      - .github/workflows/tei-p5-candidate.yml
      - cleaned/en/ISBE.xml
      - cleaned/en/article-index.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-fidelity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test all existing and new source-fidelity fixtures
        run: python3 -m unittest discover -s tests -v
      - name: Produce separate serialized candidate and all-article parity report
        run: |
          mkdir -p workspace/candidates/en
          python3 scripts/normalize_tei_p5.py \
            --input cleaned/en/ISBE.xml \
            --index cleaned/en/article-index.json \
            --manifest workspace/changes/tei-p5-candidate-v1.json \
            --output workspace/candidates/en/ISBE.xml \
            --report workspace/candidates/en/tei-p5-candidate-report.json
      - name: Verify pinned official TEI P5 4.12.0 RELAX NG schema
        shell: bash
        run: |
          set -euo pipefail
          url="https://www.tei-c.org/Vault/P5/4.12.0/xml/tei/custom/schema/relaxng/tei_all.rng"
          curl --fail --location --silent --show-error --retry 2 "$url" -o /tmp/tei_all-4.12.0.rng
          echo "b0f115095ead2ccc6933aa3365c6f4a82cba3b2ec7eee7f76bb616d7a63b7e48  /tmp/tei_all-4.12.0.rng" | sha256sum --check --strict
          sudo apt-get update -qq
          sudo apt-get install -y -qq jing
          jing /tmp/tei_all-4.12.0.rng workspace/candidates/en/ISBE.xml
      - name: Confirm the official schema rejects an invalid paragraph
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/invalid-tei-p5.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <TEI xmlns="http://www.tei-c.org/ns/1.0">
            <teiHeader><fileDesc><titleStmt><title>Invalid control</title></titleStmt>
            <publicationStmt><p>Test</p></publicationStmt>
            <sourceDesc><p>Test</p></sourceDesc></fileDesc></teiHeader>
            <text><body><p type="not-valid-on-p">Bad</p></body></text>
          </TEI>
          XML
          if jing /tmp/tei_all-4.12.0.rng /tmp/invalid-tei-p5.xml; then
            echo "Official RNG accepted the intentionally invalid fixture" >&2
            exit 1
          fi
          echo "Verified: malformed TEI structural control rejected"
      - name: Inventory official TEI P5 4.12.0 Schematron (digest discovery)
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          url="https://www.tei-c.org/Vault/P5/4.12.0/xml/tei/Exemplars/tei_all.isosch"
          echo "Official versioned Schematron source: $url"
          curl --fail --location --silent --show-error --retry 2 "$url" -o /tmp/tei_all-4.12.0.isosch
          file /tmp/tei_all-4.12.0.isosch
          wc -c /tmp/tei_all-4.12.0.isosch
          sha256sum /tmp/tei_all-4.12.0.isosch
      - name: Publish candidate for independent official schema review
        uses: actions/upload-artifact@v4
        with:
          name: isbe-tei-p5-unvalidated-candidate
          path: |
            workspace/candidates/en/ISBE.xml
            workspace/candidates/en/tei-p5-candidate-report.json
          if-no-files-found: error
          retention-days: 30
