name: One-time retain verified ISBE SWORD binary in unpublished release draft
on:
  push:
    branches: [ops/archive-verified-sword-candidate-in-private-release-draft]
    paths: [.github/workflows/_one-shot-archive-isbe-sword-draft.yml]
permissions:
  contents: write
  actions: read
jobs:
  preserve-private-candidate:
    if: github.ref == 'refs/heads/ops/archive-verified-sword-candidate-in-private-release-draft'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: isbe-1915-v0.1.0-rc.1
      RELEASE_ID: "455869112"
      SOURCE_RUN: "45259095383"
      SHA: "6993937ffcdba83348dc0f0cc510613a42f85d3e4c5423f19355a1cf65ee9c9b"
    steps:
      - uses: actions/checkout@v4
      - name: Require existing release to remain nonpublic
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/releases/$RELEASE_ID" --jq '{draft,prerelease,tag_name,published_at}'
          test "$(gh api "repos/$GH_REPO/releases/$RELEASE_ID" --jq .draft)" = true
          test "$(gh api "repos/$GH_REPO/releases/$RELEASE_ID" --jq .prerelease)" = true
          test "$(gh api "repos/$GH_REPO/releases/$RELEASE_ID" --jq '.published_at // "null"')" = null
          test "$(gh api "repos/$GH_REPO/releases/$RELEASE_ID" --jq .tag_name)" = "$TAG"
          if gh api "repos/$GH_REPO/releases/$RELEASE_ID/assets" --jq '.[].name' |
             grep -q 'BRISBE1915-native-candidate-NOT-FOR-PUBLICATION'; then
             echo "Binary is already attached to draft: refusing overwrite" >&2
             exit 1
          fi
      - name: Retrieve exact successful native artifact
        run: |
          set -euo pipefail
          test "$(gh run view "$SOURCE_RUN" -R "$GH_REPO" --json conclusion --jq .conclusion)" = success
          test "$(gh run view "$SOURCE_RUN" -R "$GH_REPO" --json headSha --jq .headSha)" = c01bc45029a9c3709f8968b83c1057a528de6d31
          mkdir -p staging/binary staging/diagnostics
          gh run download "$SOURCE_RUN" -R "$GH_REPO" -n BRISBE1915-native-candidate-NOT-FOR-PUBLICATION -D staging/binary
          gh run download "$SOURCE_RUN" -R "$GH_REPO" -n brisbe1915-native-validation-diagnostics -D staging/diagnostics
          echo "$SHA  staging/binary/BRISBE1915-native-candidate-NOT-FOR-PUBLICATION.tar.gz" | sha256sum --check --strict
      - name: Validate complete native SWORD and 9380-entry proof
        run: |
          set -euo pipefail
          tar -tzf staging/binary/BRISBE1915-native-candidate-NOT-FOR-PUBLICATION.tar.gz > staging/contents.txt
          for entry in ./mods.d/brisbe1915.conf \
              ./modules/lexdict/zld/brisbe1915/dict.zdt \
              ./modules/lexdict/zld/brisbe1915/dict.zdx \
              ./modules/lexdict/zld/brisbe1915/dict.idx \
              ./modules/lexdict/zld/brisbe1915/dict.dat; do
              grep -Fxq "$entry" staging/contents.txt
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("staging/diagnostics/sword-native-roundtrip.json").read_text())
          assert d["expected_keys"]==d["native_keys"]==9380
          assert d["native_roundtrip_verified"] is True
          for key in ("missing_key_count","unexpected_key_count","malformed_count",
                      "unicode_text_mismatch_count","xml_structure_mismatch_count"):
              assert d[key]==0,key
          s=json.loads(Path("staging/diagnostics/diatheke-render-smoke.json").read_text())
          assert s["independent_gui_reader_verified"] is False
          assert len(s["smoke_articles"])==4
          for article,formats in s["smoke_articles"].items():
              assert formats["HTMLHREF"]["html_anchor_count"]>0,article
          PY
          printf '%s  %s\n' "$SHA" \
              BRISBE1915-native-candidate-NOT-FOR-PUBLICATION.tar.gz > staging/BRISBE1915-NATIVE-SHA256SUMS.txt
      - name: Attach native module and reader evidence to UNPUBLISHED DRAFT ONLY
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/releases/$RELEASE_ID" --jq .draft)" = true
          gh release upload "$TAG" \
              staging/binary/BRISBE1915-native-candidate-NOT-FOR-PUBLICATION.tar.gz \
              staging/BRISBE1915-NATIVE-SHA256SUMS.txt \
              staging/diagnostics/sword-native-roundtrip.json \
              staging/diagnostics/diatheke-render-smoke.json \
              -R "$GH_REPO"
          test "$(gh api "repos/$GH_REPO/releases/$RELEASE_ID" --jq .draft)" = true
          test "$(gh api "repos/$GH_REPO/releases/$RELEASE_ID" --jq '.published_at // "null"')" = null
          gh api "repos/$GH_REPO/releases/$RELEASE_ID/assets" --jq '.[] | [.name,.size] | @tsv'
          echo "SUCCESS: Binary and evidence retained privately in release DRAFT. NOT PUBLISHED."
