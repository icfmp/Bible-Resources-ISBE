name: Source-image collation for scripture mismatch continuations

on:
  pull_request:
    paths:
      - '.github/workflows/inspect-1915-scripture-continuations.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  printed-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {volume: '2', pages: '323,645,691'}
          - {volume: '3', pages: '414,672'}
          - {volume: '4', pages: '336'}
          - {volume: '5', pages: '76,352'}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Download identified original 1915 PDF
        run: |
          mkdir -p workspace/tmp
          curl --fail --location --silent --show-error --retry 4 --retry-all-errors \
            --connect-timeout 20 --max-time 480 \
            "https://commons.wikimedia.org/wiki/Special:Redirect/file/The_International_Standard_Bible_Encyclopedia_Volume_${{ matrix.volume }}.pdf" \
            --output "workspace/tmp/v${{ matrix.volume }}.pdf"
      - name: Render exact source-page evidence for human visual review
        run: |
          python3 scripts/render_1915_print_evidence.py \
            --pdf "workspace/tmp/v${{ matrix.volume }}.pdf" \
            --volume "${{ matrix.volume }}" --pages "${{ matrix.pages }}"
