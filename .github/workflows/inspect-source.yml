name: Inspect original ISBE SWORD module
on:
  push:
    paths:
      - .github/workflows/inspect-source.yml
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libsword-utils
      - name: Inspect source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/isbe-sword workspace/reports
          unzip -q sources/crosswire/isbe-2.2/ISBE.zip -d /tmp/isbe-sword
          printf '=== CONF ===\n' > workspace/reports/source-inspection.txt
          cat /tmp/isbe-sword/mods.d/isbe.conf >> workspace/reports/source-inspection.txt
          SWORD_PATH=/tmp/isbe-sword mod2imp ISBE > /tmp/isbe-raw.imp
          printf '\n=== EXPORT SIZE / ENTRIES ===\n' >> workspace/reports/source-inspection.txt
          wc -bc /tmp/isbe-raw.imp >> workspace/reports/source-inspection.txt
          grep -ac '^\$\$\$' /tmp/isbe-raw.imp >> workspace/reports/source-inspection.txt
          printf '\n=== FIRST 6500 BYTES ===\n' >> workspace/reports/source-inspection.txt
          head -c 6500 /tmp/isbe-raw.imp >> workspace/reports/source-inspection.txt
          printf '\n=== FIRST 30 KEYS ===\n' >> workspace/reports/source-inspection.txt
          grep -a '^\$\$\$' /tmp/isbe-raw.imp | head -30 >> workspace/reports/source-inspection.txt || true
          git add workspace/reports/source-inspection.txt
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Record SWORD ISBE source inspection'
          git push
