name: Inventory ISBE TEI structures
on:
  push:
    paths:
      - .github/workflows/audit-tei-structure.yml
      - scripts/audit_tei_structure.py
permissions:
  contents: write
concurrency:
  group: isbe-tei-structure-inventory
  cancel-in-progress: true
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect full canonical TEI corpus without modifying it
        run: |
          python3 scripts/audit_tei_structure.py cleaned/en/ISBE.xml \
            --report workspace/reports/tei-structure-inventory.json
      - name: Record structural inventory
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add workspace/reports/tei-structure-inventory.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Record full-corpus TEI structural inventory'
          git pull --rebase origin main
          git push origin HEAD:main
