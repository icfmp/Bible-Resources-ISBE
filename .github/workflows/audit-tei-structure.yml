name: Verify committed ISBE TEI P5 structural inventory
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/audit-tei-structure.yml
      - scripts/audit_tei_structure.py
      - workspace/witnesses/crosswire-2.2/ISBE.xml
      - workspace/reports/tei-structure-inventory.json
  pull_request:
    paths:
      - .github/workflows/audit-tei-structure.yml
      - scripts/audit_tei_structure.py
      - workspace/witnesses/crosswire-2.2/ISBE.xml
      - workspace/reports/tei-structure-inventory.json
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert that complete serialized canonical structure matches checked-in report
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/audit_tei_structure.py workspace/witnesses/crosswire-2.2/ISBE.xml \
            --report /tmp/isbe-canonical-inventory.json \
            --expected-entries 9380 \
            --strict-profile \
            --reject-active-broken-links \
            --reject-non-tei-namespace
          cmp /tmp/isbe-canonical-inventory.json workspace/reports/tei-structure-inventory.json
