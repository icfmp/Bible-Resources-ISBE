name: Audit ISBE unresolved-link contexts
on:
  push:
    paths:
      - .github/workflows/audit-link-contexts.yml
      - scripts/audit_link_contexts.py
      - cleaned/en/ISBE.xml
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect links against canonical index and text
        run: python3 scripts/audit_link_contexts.py --input cleaned/en/ISBE.xml --output workspace/reviews/link-contexts.json
      - name: Commit reproducible review diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add workspace/reviews/link-contexts.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record contextual ISBE link review candidates'
          git pull --rebase origin main
          git push origin HEAD:main
