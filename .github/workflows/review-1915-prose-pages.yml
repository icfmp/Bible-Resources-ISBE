name: Inspect unresolved 1915 redirect glyphs and SESIS

on:
  pull_request:
    paths:
      - '.github/workflows/review-1915-prose-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {volume: "1", page: "329", key: "ASTARTE_AST", crop: "no"}
          - {volume: "4", page: "385", key: "PROSTRATION", crop: "no"}
          - {volume: "4", page: "663", key: "SESIS_DETAIL", crop: "yes"}
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF renderer
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Fetch SHA-locked 1915 source and render page
        shell: bash
        env:
          VOLUME: ${{ matrix.volume }}
          PAGE: ${{ matrix.page }}
          KEY: ${{ matrix.key }}
          CROP: ${{ matrix.crop }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors --connect-timeout 20 --max-time 360 "https://commons.wikimedia.org/wiki/Special:Redirect/file/The_International_Standard_Bible_Encyclopedia_Volume_${VOLUME}.pdf" -o /tmp/original.pdf
          python - <<'PY'
          import os,json,hashlib
          from pathlib import Path
          v=next(x for x in json.loads(Path('sources/print/1915-volume-witnesses.json').read_text())['volumes'] if x['volume']==os.environ['VOLUME'])
          digest=hashlib.sha256(Path('/tmp/original.pdf').read_bytes()).hexdigest()
          assert digest==v['pdf_sha256'], 'Wrong original facsimile'
          print('Verified original source PDF sha256:',digest)
          PY
          if [[ "$CROP" == "yes" ]]; then
            pdftoppm -f "$PAGE" -l "$PAGE" -singlefile -png -r 300 -x 160 -y 260 -W 900 -H 230 /tmp/original.pdf /tmp/visible >/dev/null 2>&1
          else
            pdftoppm -f "$PAGE" -l "$PAGE" -singlefile -png -r 160 /tmp/original.pdf /tmp/visible >/dev/null 2>&1
          fi
          python - <<'PY'
          import os,base64
          from pathlib import Path
          image=Path('/tmp/visible.png').read_bytes()
          encoded=base64.b64encode(image).decode()
          print('BEGIN_IMAGE:'+os.environ['KEY']+':'+str(len(image)))
          for i in range(0,len(encoded),2000):
              print('IMG_CHUNK:'+encoded[i:i+2000])
          print('END_IMAGE:'+os.environ['KEY'])
          PY
