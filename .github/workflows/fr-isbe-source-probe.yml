name: Temporary read-only French ISBE source extraction
on:
  push:
    branches:
      - work/fr-isbe-cohort-014-source-extract
    paths:
      - .github/workflows/fr-isbe-source-probe.yml
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract the ten shortest undrafted canonical entries
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from scripts.validate_translation_identity import read_body, XML_ID
          from scripts.apply_translation_pilot import text_units, preserve_immutable
          from scripts.select_translation_pilot import stable_xml_fingerprint
          
          root=Path("workspace/translations/isbe-1915/fr")
          work=json.loads((root/"worklists/wave-01/0001-1000.json").read_text(encoding="utf-8"))["entries"]
          allowed={row["source_key"] for row in work}
          draft_paths=[Path("workspace/pilots/isbe-1915-fr/draft-patches.json"), *sorted((root/"batches").glob("*.json"))]
          drafted=set()
          for path in draft_paths:
              for row in json.loads(path.read_text(encoding="utf-8"))["articles"]:
                  drafted.add(row["source_key"])
          _,body=read_body(Path("sources/cleaned/encyclopedias/en/isbe-1915/ISBE.xml"))
          candidates=[]
          for position,article in enumerate(body,1):
              key=article.get("n")
              if key not in allowed or key in drafted:
                  continue
              units=list(text_units(article))
              eligible=sum(len(value) for _,node,part,value in units if not preserve_immutable(node,part))
              candidates.append((eligible,position,key,article,units))
          candidates.sort(key=lambda row:(row[0],row[1]))
          print("ISBE_STATS="+json.dumps({"drafted_all":len(drafted),"remaining":len(candidates),"next_20":[{"chars":x[0],"position":x[1],"source_key":x[2]} for x in candidates[:20]]},ensure_ascii=False))
          for chars,position,key,article,units in candidates[:10]:
              row={"source_key":key,"source_position":position,"article_id":article.get(XML_ID),"source_article_sha256":stable_xml_fingerprint(article),"source_eligible_chars":chars,
                   "units":[{"node":ordinal,"part":part,"tag":node.tag.rsplit("}",1)[-1],"source":value,"immutable":preserve_immutable(node,part)} for ordinal,node,part,value in units]}
              print("ISBE_EXTRACT="+json.dumps(row,ensure_ascii=False))
          PY
