name: Validate source-locked French ISBE translation batches

on:
  push:
    paths:
      - 'scripts/apply_translation_batches.py'
      - 'scripts/export_translation_source.py'
      - 'scripts/render_translation_reading_copy.py'
      - 'tests/test_translation_batches.py'
      - 'tests/test_translation_cohort_manifests.py'
      - 'workspace/translations/isbe-1915/fr/**'
      - '.github/workflows/fr-translation-batches.yml'
  pull_request:
    paths:
      - 'scripts/apply_translation_batches.py'
      - 'scripts/export_translation_source.py'
      - 'scripts/render_translation_reading_copy.py'
      - 'tests/test_translation_batches.py'
      - 'tests/test_translation_cohort_manifests.py'
      - 'workspace/translations/isbe-1915/fr/**'
      - '.github/workflows/fr-translation-batches.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-locked:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect canonical next hundred undrafted English source entries
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from scripts.apply_translation_batches import load_patches
          from scripts.apply_translation_pilot import text_units, preserve_immutable
          from scripts.select_translation_pilot import SOURCE_SHA256, stable_xml_fingerprint
          from scripts.validate_translation_identity import XML_ID, read_body, sha256
          root=Path('workspace/translations/isbe-1915/fr')
          source=Path('sources/cleaned/encyclopedias/en/isbe-1915/ISBE.xml')
          assert sha256(source)==SOURCE_SHA256
          roster=json.loads((root/'worklists/wave-01/0001-1000.json').read_text(encoding='utf8'))['entries']
          patches=[Path('workspace/pilots/isbe-1915-fr/draft-patches.json'),*sorted((root/'batches').glob('*.json'))]
          drafted=load_patches(patches)
          _,body=read_body(source)
          by_id={entry.get(XML_ID):entry for entry in body}
          candidates=[]
          for row in roster:
              aid=row['article_id']
              if aid in drafted: continue
              article=by_id[aid]
              units=list(text_units(article))
              eligible=[(n,node,part,s) for n,node,part,s in units if not preserve_immutable(node,part)]
              if not eligible: continue
              length=sum(len(u[3]) for u in eligible)
              candidates.append((length,row['index'],row,article,units))
          picked=sorted(sorted(candidates)[:100],key=lambda x:x[1])
          print('COHORT002_META='+json.dumps({'eligible_remaining':len(candidates),'selected':len(picked),'source_chars':sum(x[0] for x in picked),'max_source_chars':max(x[0] for x in picked),'min_source_chars':min(x[0] for x in picked),'source_sha256':SOURCE_SHA256}))
          for length,index,row,article,units in picked:
              print('COHORT002_ARTICLE='+json.dumps({'index':index,'source_key':row['source_key'],'article_id':row['article_id'],'source_article_sha256':stable_xml_fingerprint(article),'eligible_source_chars':length,'units':[{'node':n,'part':part,'tag':node.tag.split('}')[-1],'source':s,'immutable':preserve_immutable(node,part)} for n,node,part,s in units]},ensure_ascii=False))
          PY
      - name: Validate original-key editorial cohort manifests
        run: python3 -m unittest tests.test_translation_cohort_manifests -v
      - name: Test source-locked batch extraction, parity and editorial gates
        run: python3 -m unittest tests.test_translation_batches -v
      - name: Reconstruct non-publishable historical French working excerpt
        run: |
          patches=(--patches workspace/pilots/isbe-1915-fr/draft-patches.json)
          for file in workspace/translations/isbe-1915/fr/batches/*.json; do
            patches+=(--patches "$file")
          done
          python3 -m scripts.apply_translation_batches \
            --source sources/cleaned/encyclopedias/en/isbe-1915/ISBE.xml \
            "${patches[@]}" \
            --output /tmp/isbe-fr-working-excerpt.xml \
            --report /tmp/isbe-fr-working-report.json
      - name: Build complete Abraham reading proof without touching canonical source
        run: |
          python3 -m scripts.render_translation_reading_copy \
            --excerpt /tmp/isbe-fr-working-excerpt.xml \
            --report /tmp/isbe-fr-working-report.json \
            --key ABRAHAM \
            --output /tmp/ABRAHAM-fr-reading-proof.md
      - name: Confirm checked-in readable proof exactly matches source-derived output
        run: cmp /tmp/ABRAHAM-fr-reading-proof.md workspace/translations/isbe-1915/fr/reviews/ABRAHAM.md
      - name: Require full draft coverage but never assert editorial approval
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('/tmp/isbe-fr-working-report.json').read_text(encoding='utf-8'))
          assert report['master_entry_count']==9380
          drafts_dir=Path('workspace/translations/isbe-1915/fr/batches')
          pilot=Path('workspace/pilots/isbe-1915-fr/draft-patches.json')
          expected=sum(len(json.loads(path.read_text(encoding='utf-8'))['articles'])
                       for path in [pilot, *sorted(drafts_dir.glob('*.json'))])
          assert report['excerpt_entries']==expected
          assert report['complete_unreviewed_drafts']==expected
          assert report['partial_unreviewed_drafts']==0
          assert report['human_reviewed']==0
          assert report['publication_permitted'] is False
          assert report['all_english_canonical_keys_and_ids_unchanged'] is True
          proof=Path('/tmp/ABRAHAM-fr-reading-proof.md').read_text(encoding='utf-8')
          for section in ('I. Le nom', 'II. La famille', 'III. La vie', 'IV. Les conditions', 'V. Le caractère', 'VI. L', 'VII. Interprétations'):
              assert section in proof, section
          assert 'J. Oscar Boyd' in proof
          print(f'VERIFIED: {expected} complete UNREVIEWED French drafts; canonical source intact; NOT published')
          PY
      - name: Retain non-publishable editorial report and Abraham reading proof
        uses: actions/upload-artifact@v4
        with:
          name: isbe-fr-unreviewed-abraham-proof
          path: |
            /tmp/ABRAHAM-fr-reading-proof.md
            /tmp/isbe-fr-working-report.json
          retention-days: 30
