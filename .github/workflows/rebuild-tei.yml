name: Reconstruct ISBE TEI corpus
on:
  push:
    paths:
      - .github/workflows/rebuild-tei.yml
      - scripts/rebuild_tei.py
      - scripts/audit_references.py
concurrency:
  group: isbe-rebuild-main
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild canonical TEI from preserved SWORD IMP export
        shell: bash
        run: |
          set -euo pipefail
          test -s workspace/exports/isbe-2.2.imp
          python3 scripts/rebuild_tei.py --input workspace/exports/isbe-2.2.imp --output cleaned/en/ISBE.xml --index cleaned/en/article-index.json --report workspace/reports/tei-reconstruction.json
          python3 scripts/audit_references.py --index cleaned/en/article-index.json --report workspace/reports/tei-reconstruction.json --output workspace/reviews/unresolved-links.json
      - name: Commit verified data artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cleaned/en/ISBE.xml cleaned/en/article-index.json workspace/reports/tei-reconstruction.json workspace/reviews/unresolved-links.json
          if git diff --cached --quiet; then
            echo "The TEI master is already up to date"
            exit 0
          fi
          git commit -m 'Update integrity-checked ISBE TEI and link review'
          git pull --rebase origin main
          git push origin HEAD:main
