name: Acquire upstream ISBE 2.2

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/acquire-isbe.yml

permissions:
  contents: write

jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download and validate unmodified upstream distribution
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/acquire_crosswire.py
      - name: Commit archive and provenance
        shell: bash
        run: |
          set -euo pipefail
          git add sources/crosswire/isbe-2.2/ISBE.zip sources/crosswire/isbe-2.2/MANIFEST.json
          if git diff --cached --quiet; then
            echo "Archive and manifest already tracked"
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Preserve original CrossWire ISBE 2.2 archive and provenance'
          git push
